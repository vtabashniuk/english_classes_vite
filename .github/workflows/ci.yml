name: CRM CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# All checks use repository code and an isolated local database; no cloud secrets.
permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Match the current local development major and tested baseline.
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Run unit tests
        run: node --test tests/*.test.js

      - name: Check ESLint
        run: npm run lint

      - name: Build Vite application
        run: npm run build

      # The CLI version is read from the root package-lock.json by the action.
      # Starts PostgreSQL in Docker and applies committed local migrations only.
      - name: Set up Supabase CLI for local SQL tests
        uses: supabase/setup-cli@v3

      - name: Start isolated local PostgreSQL
        run: supabase db start

      - name: Run local RLS and RPC regression tests
        run: supabase test db --local
